name: Release

# Publishes a release for each merge to main that holds a feat, fix or breaking commit,
# then starts the Homebrew tap's update run. The tap's six-hour run stays as the backup.
# Then it checks its own work: the release is published with notes, and the tap's formula
# downloads this release's archive with a matching checksum (scripts/verify-release.sh).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    # The same gate as the pull request check; the release waits for it.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/check.yml

  release:
    needs: check
    # A manual run from another branch must not publish that branch's unmerged commits.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Work out the next version
        id: version
        run: |
          # Runs can start out of order. A run that is no longer at the tip of main stands down:
          # the newer run counts every commit since the last tag, so nothing is lost and latest never goes backwards.
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main has moved past this commit: a newer run releases it."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(scripts/next-version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "No feat, fix or breaking commit since the last tag: nothing to release."; fi

      - name: Publish the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Desk Check $VERSION" --generate-notes --latest

      - name: Check the published release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/verify-release.sh release "$VERSION" "$GITHUB_SHA"

      - name: Start the Homebrew tap update
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.TAP_DISPATCH_TOKEN }}
        run: |
          # The release is already out, and the tap's six-hour run still delivers it if this fails.
          # The run fails anyway, because it cannot check the formula without the tap's update run.
          if ! gh workflow run update.yml -R marcellovictorino/homebrew-tap; then
            echo "::error::Could not start the tap update (TAP_DISPATCH_TOKEN missing or expired), so this run cannot check the Homebrew formula. The tap's scheduled run will pick up the release; renew the token."
            exit 1
          fi

      - name: Check the Homebrew formula
        # Waits up to 20 minutes for the tap's update run, then compares the formula with the release's archive.
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/verify-release.sh tap "$VERSION"
