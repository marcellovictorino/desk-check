name: Check

# The one gate (scripts/check.sh) on a GitHub-hosted Mac. Runs on every pull request, and the
# release workflow calls it too, so nothing is published unless it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the gate
        run: scripts/check.sh
